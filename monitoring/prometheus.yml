global:
  scrape_interval: 15s  # scrape every 15 seconds

scrape_configs:
  - job_name: "queueflow-api"
    static_configs:
      - targets: ["api:8000"]  # scrapes http://api:8000/metrics

  - job_name: "queueflow-worker"
    static_configs:
      - targets: ["worker:9090"]  # scrapes http://worker:9090/metrics