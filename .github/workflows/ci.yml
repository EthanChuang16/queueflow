name: CI

# trigger this workflow on every push to main and on pull requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      # spin up a postgres container for integration tests
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: queueflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # spin up a redis container
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/queueflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testingsecretkey
          CELERY_CONCURRENCY: 2
          DEBUG: "true"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: queueflow_test
          GRAFANA_ADMIN_PASSWORD: admin
        run: pytest tests/ -v

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test  # only runs if tests pass
    if: github.ref == 'refs/heads/main'  # only on main branch pushes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker registry tags must be lowercase, but the repository owner
      # (EthanChuang16) contains uppercase letters, so convert it here.
      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LC }}/queueflow-api:latest
            ghcr.io/${{ env.REPO_OWNER_LC }}/queueflow-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LC }}/queueflow-worker:latest
            ghcr.io/${{ env.REPO_OWNER_LC }}/queueflow-worker:${{ github.sha }}