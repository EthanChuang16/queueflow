# Celery worker Deployment. Same codebase/image family as the API, but runs
# `worker/entrypoint.sh` (see Dockerfile.worker) instead of Uvicorn. No
# Service is needed - workers pull jobs from Redis rather than receiving
# inbound traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
          imagePullPolicy: {{ .Values.worker.pullPolicy }}
          envFrom:
            - configMapRef:
                name: queueflow-config
            - secretRef:
                name: queueflow-secret
          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu | quote }}
              memory: {{ .Values.worker.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu | quote }}
              memory: {{ .Values.worker.resources.limits.memory | quote }}
          # No HTTP port to probe, so we shell out to Celery's own ping
          # command: it asks the worker process to respond over the broker,
          # confirming it's actually consuming from the queue rather than
          # just running as a process.
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.core.celery.celery_app
                - inspect
                - ping
            initialDelaySeconds: {{ .Values.worker.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.livenessProbe.timeoutSeconds }}
