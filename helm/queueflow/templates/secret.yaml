# Secret holds sensitive values consumed via `envFrom.secretRef` by the
# postgres, api, and worker Deployments.
#
# IMPORTANT: `data` values here are only base64-*encoded*, not encrypted -
# anyone with read access to Secrets in this namespace can decode them
# (e.g. `echo cGFzc3dvcmQ= | base64 -d`). That's fine for local/demo
# clusters, but before this ever runs against a real cluster, replace this
# with sealed-secrets, external-secrets, or a vault-backed provider.
apiVersion: v1
kind: Secret
metadata:
  name: queueflow-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc }}
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres-service:%v/%s" .Values.postgres.user .Values.secrets.postgresPassword .Values.postgres.port .Values.postgres.database | b64enc }}
