# PersistentVolumeClaim requests durable disk for Postgres data so a pod
# restart (or reschedule to another node) doesn't wipe the database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
# Single-replica Postgres Deployment. Only one replica makes sense here since
# Postgres isn't horizontally scalable without a replication setup - if this
# pod dies, Kubernetes reschedules it and it re-attaches to the same PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}"
          ports:
            - containerPort: {{ .Values.postgres.port }}
          envFrom:
            - configMapRef:
                name: queueflow-config
            - secretRef:
                name: queueflow-secret
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          # Requests: what the scheduler reserves for this pod on a node.
          # Limits: the hard ceiling the pod can't exceed before being
          # throttled (CPU) or killed (memory, OOMKilled).
          resources:
            requests:
              cpu: {{ .Values.postgres.resources.requests.cpu | quote }}
              memory: {{ .Values.postgres.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgres.resources.limits.cpu | quote }}
              memory: {{ .Values.postgres.resources.limits.memory | quote }}
          # readinessProbe: is Postgres ready to accept connections? If not,
          # Kubernetes stops routing traffic to it via postgres-service
          # without restarting the pod.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: {{ .Values.postgres.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgres.readinessProbe.periodSeconds }}
          # livenessProbe: is Postgres still alive? If this fails repeatedly,
          # Kubernetes restarts the container.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: {{ .Values.postgres.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgres.livenessProbe.periodSeconds }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# ClusterIP Service (the default type) gives other pods in the namespace a
# stable DNS name, `postgres-service`, to reach Postgres regardless of which
# node the pod is scheduled on.
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
