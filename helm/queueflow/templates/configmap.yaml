# ConfigMap holds non-secret configuration shared by the API and worker
# Deployments via `envFrom`. Anything here is fine to see in `kubectl get
# configmap -o yaml` - passwords/keys belong in secret.yaml instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: queueflow-config
  namespace: {{ .Release.Namespace }}
data:
  REDIS_URL: "redis://redis-service:{{ .Values.redis.port }}/0"
  CELERY_CONCURRENCY: {{ .Values.config.celeryConcurrency | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
